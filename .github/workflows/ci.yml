name: CI - Build and Test Work Item Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Lint, Test, and Build Containers
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged
        ports:
          - 2375:2375

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------
      # 🧹 1. Lint & Test Backend
      # ---------------------------
      - name: Setup Node.js for backend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Lint backend
        working-directory: ./backend
        run: npm run lint

      - name: Test backend
        working-directory: ./backend
        run: npm test

      # ---------------------------
      # 🧹 2. Lint & Test Frontend
      # ---------------------------
      - name: Setup Node.js for frontend
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ./frontend
        run: npm run lint

      
      - name: Test frontend
        working-directory: ./frontend
        run: npm test || echo "No frontend tests yet"

      # ---------------------------
      # 🏗️ 3. Build Docker Images
      # ---------------------------
      - name: Build backend Docker image
        run: docker build -t workitem-backend:ci ./backend

      - name: Build frontend Docker image
        run: docker build -t workitem-frontend:ci ./frontend

      # ---------------------------
      # ✅ 4. Compose Integration Check
      # ---------------------------
      - name: Verify containers start successfully
        run: |
          docker compose -f docker-compose.yml up -d
          sleep 10
          docker ps
          docker compose down

