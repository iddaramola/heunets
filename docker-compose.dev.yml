services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: huenets-backend
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: huenets-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_BASE=http://backend:4000
      - NODE_ENV=development
    command: npm run dev
    depends_on:
      - backend
