services:
  backend:
    build:
      context: ./backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app          
      - /app/node_modules       
    command: npm run dev         
    environment:
      - NODE_ENV=development

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE=http://backend:4000
    volumes:
      - ./frontend:/app         
      - /app/node_modules        
    command: npm run dev          
    depends_on:
      - backend
